name: Release

# Chaque push sur main dont la version (src-tauri/tauri.conf.json) n'a pas encore
# de release GitHub déclenche build multi-plateforme + publication.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/check.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      skip: ${{ steps.meta.outputs.skip }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Version et brouillon de release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1 \
             || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release_id=" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION déjà publiée, incrémente la version avec \`npm run bump -- x.y.z\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          gh release create "v$VERSION" --draft --generate-notes \
            --target "${{ github.sha }}" \
            --title "Media Downloader v$VERSION"
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" --jq .id 2>/dev/null \
            || gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"v$VERSION\") | .id" | head -n1)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release brouillon v$VERSION créée (id $RELEASE_ID)." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # macos-13 (Intel) n'existe plus : cross-compilation depuis le runner ARM
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Dépendances Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libssl-dev

      - run: npm ci

      - name: Télécharger ffmpeg (sidecar)
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }}

  # Si un build de la matrice échoue, ce job n'est pas exécuté (needs) :
  # la release reste en brouillon et peut être relancée via "Re-run failed jobs".
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --draft=false --latest
          echo "Release v${{ needs.prepare.outputs.version }} publiée." >> "$GITHUB_STEP_SUMMARY"
